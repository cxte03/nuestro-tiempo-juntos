<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nuestras Películas</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #282c34;
            color: #abb2bf;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .contenedor {
            background: #21252b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 450px;
            margin: 0 auto;
        }
        h1 {
            color: #e06c75;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        .categoria-titulo {
            color: #61afef;
            font-size: 1.3em;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px dashed #5c6370;
            padding-bottom: 5px;
            text-align: left;
            text-transform: capitalize;
        }
        .lista-peliculas {
            text-align: left;
            margin-bottom: 30px;
            padding: 0;
            list-style: none;
        }
        .pelicula {
            background-color: #282c34;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #e5c07b; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em;
            transition: 0.3s;
        }
        .pelicula.vista {
            border-left-color: #98c379; 
            opacity: 0.6;
        }
        .pelicula.vista .titulo {
            text-decoration: line-through;
            color: #5c6370;
        }
        .icono {
            font-size: 1.3em;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 25px;
            background-color: #e06c75;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-volver:hover {
            background-color: #be5058;
            transform: scale(1.05);
        }
        #estado {
            color: #61afef;
            font-style: italic;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Cine Juntos 🍿</h1>
        
        <div id="estado">Cargando la cartelera...</div>
        
        <div id="contenedor-peliculas"></div>
        
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </div>

    <script>
        // TU ENLACE AL EXCEL
        const URL_EXCEL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvWQx8A2hBf5KyCTjp4uVbzSuvsIAqG57pgUYuKkNc2QjjRHgxLU2VsXtmG-My2ZSocrm1tsmZ7h81/pub?output=csv";

        const contenedorPeliculas = document.getElementById("contenedor-peliculas");
        const estado = document.getElementById("estado");

        fetch(URL_EXCEL)
            .then(respuesta => respuesta.text())
            .then(datosCSV => {
                estado.style.display = "none";
                
                const filas = datosCSV.split(/\r?\n/);
                const peliculasPorCategoria = {};
                
                // Empezamos desde la fila 0 para no perdernos ninguna película
                for (let i = 0; i < filas.length; i++) {
                    const fila = filas[i].trim();
                    if (!fila) continue;
                    
                    // Detecta si tu Excel usa comas o puntos y comas
                    const separador = fila.includes(";") ? ";" : ",";
                    const columnas = fila.split(separador);
                    
                    // Limpiamos el texto por si tiene comillas raras
                    let titulo = columnas[0] ? columnas[0].replace(/^"|"$/g, '').trim() : "Película sin título";
                    
                    // Si detecta que la fila es la de las cabeceras ("Título", "Vista"), la salta
                    if (titulo.toLowerCase() === "título" || titulo.toLowerCase() === "titulo") {
                        continue;
                    }

                    let estadoVista = columnas[1] ? columnas[1].replace(/^"|"$/g, '').trim().toLowerCase() : "no";
                    let categoria = columnas[2] ? columnas[2].replace(/^"|"$/g, '').trim() : "Otros";

                    // Si dejaste la categoría en blanco en alguna peli
                    if (categoria === "") {
                        categoria = "Otros";
                    }

                    const esVista = (estadoVista === "sí" || estadoVista === "si" || estadoVista === "yes");

                    if (!peliculasPorCategoria[categoria]) {
                        peliculasPorCategoria[categoria] = [];
                    }

                    peliculasPorCategoria[categoria].push({
                        titulo: titulo,
                        esVista: esVista
                    });
                }

                // Renderizamos las categorías en la pantalla
                for (const categoria in peliculasPorCategoria) {
                    const tituloCategoria = document.createElement("h2");
                    tituloCategoria.className = "categoria-titulo";
                    tituloCategoria.textContent = categoria;
                    contenedorPeliculas.appendChild(tituloCategoria);

                    const ul = document.createElement("ul");
                    ul.className = "lista-peliculas";

                    peliculasPorCategoria[categoria].forEach(peli => {
                        const li = document.createElement("li");
                        li.className = "pelicula" + (peli.esVista ? " vista" : "");
                        
                        li.innerHTML = `
                            <span class="titulo">${peli.titulo}</span>
                            <span class="icono">${peli.esVista ? "✅" : "🎬"}</span>
                        `;
                        ul.appendChild(li);
                    });

                    contenedorPeliculas.appendChild(ul);
                }
            })
            .catch(error => {
                estado.innerHTML = "❌ Error al cargar. Comprueba el enlace.";
                console.error(error);
            });
    </script>
</body>
</html>
