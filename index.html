<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nuestro Tiempo Juntos</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #282c34;
            color: #abb2bf;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .contenedor {
            background: #21252b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
            margin: 0 auto;
            position: relative; 
        }
        h1 {
            color: #e06c75;
            font-size: 1.5em;
        }
        .foto-principal {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .reloj {
            font-size: 1.2em;
            font-weight: bold;
            color: #98c379;
            margin: 15px 0;
            line-height: 1.6;
        }
        .separador {
            font-size: 0.9em;
            color: #5c6370;
            margin: 20px 0 5px 0;
            border-top: 1px dashed #5c6370;
            padding-top: 15px;
        }
        .mensaje {
            color: #61afef;
            font-style: italic;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        
        /* --- ESTILOS DE LOS ICONOS OCULTOS --- */
        .icono-huevo {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.1; 
            transition: all 0.3s;
        }
        .icono-huevo:hover {
            opacity: 1; 
            transform: scale(1.2);
        }
        .icono-commits {
            position: absolute;
            bottom: 15px;
            left: 20px; /* Lo ponemos a la izquierda */
            font-size: 20px;
            cursor: pointer;
            opacity: 0.1; 
            transition: all 0.3s;
        }
        .icono-commits:hover {
            opacity: 1; 
            transform: scale(1.2);
        }

        /* --- ESTILOS DE LAS VENTANAS EMERGENTES (MODALES) --- */
        #modal-vale, #modal-commits {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 999; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }
        #modal-vale img {
            max-width: 85%;
            max-height: 70%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,1);
            animation: aparecer 0.4s ease-out;
        }
        @keyframes aparecer {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .btn-cerrar {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #e06c75;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-cerrar:hover {
            background-color: #be5058;
        }

        /* Estilos de la terminal dentro de la ventana emergente */
        .terminal {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            font-size: 0.9em;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,1);
            width: 85%;
            max-width: 400px;
            animation: aparecer 0.3s ease-out;
        }
        .terminal-header {
            color: #5c6370;
            margin-bottom: 15px;
            border-bottom: 1px dashed #5c6370;
            padding-bottom: 8px;
            font-size: 0.85em;
        }
        .commit { margin-bottom: 15px; line-height: 1.4; }
        .hash { color: #d19a66; font-weight: bold; }
        .comando { color: #56b6c2; }
        .msg { color: #98c379; }
        .date { color: #5c6370; font-style: italic; padding-left: 15px; font-size: 0.85em; }
    </style>
</head>
<body>
    <!-- PÁGINA PRINCIPAL (Exactamente como la tenías) -->
    <div class="contenedor">
        <h1>Te quiero ❤️</h1>
        
        <img src="Fondo.png" alt="Nosotros" class="foto-principal">
        
        <p>Cuanto tiempo llevas haciendome la persona más feliz del mundo:</p>
        
        <div class="reloj" id="contador-anios">Cargando datos...</div>
        
        <div class="separador">Que en total son exactamente:</div>
        
        <div class="reloj" id="contador-dias">Cargando datos...</div>
        
        <p class="mensaje">Eres el amor de mi vida &lt;3</p>

        <!-- Botones ocultos -->
        <div class="icono-commits" onclick="abrirCommits()" title="Historial">💻</div>
        <div class="icono-huevo" onclick="abrirVale()" title="¿Qué es esto?">🐕
