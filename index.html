<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nuestro Tiempo Juntos</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #282c34;
            color: #abb2bf;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .contenedor {
            background: #21252b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
            margin: 0 auto;
        }
        h1 {
            color: #e06c75;
            font-size: 1.5em;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .reloj {
            font-size: 1.2em;
            font-weight: bold;
            color: #98c379;
            margin: 15px 0;
            line-height: 1.6;
        }
        .separador {
            font-size: 0.9em;
            color: #5c6370;
            margin: 20px 0 5px 0;
            border-top: 1px dashed #5c6370;
            padding-top: 15px;
        }
        .mensaje {
            color: #61afef;
            font-style: italic;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Te quiero ❤️</h1>
        
        <img src="Fondo.png" alt="Nosotros">
        
        <p>Cuanto tiempo llevas haciendome la persona más feliz:</p>
        
        <!-- Primer contador: Años, meses y días -->
        <div class="reloj" id="contador-anios">Cargando datos...</div>
        
        <div class="separador">Que en total son exactamente:</div>
        
        <!-- Segundo contador (el original): Días totales, horas, minutos, segundos -->
        <div class="reloj" id="contador-dias">Cargando datos...</div>
        
        <p class="mensaje">Eres el amor de mi vida &lt;3</p>
    </div>

    <script>
        // ¡ATENCIÓN! Cambia esta fecha por el día y hora de vuestro aniversario.
        const inicio = new Date("2024-10-19T11:30:00");

        function actualizarReloj() {
            const ahora = new Date();
            
            // 1. CÁLCULO PARA EL CONTADOR ORIGINAL (Días totales, horas, minutos, segundos)
            const diferencia = ahora.getTime() - inicio.getTime();
            const totalDias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("contador-dias").innerHTML = 
                totalDias + " días <br>" + 
                horas + " horas <br>" + 
                minutos + " minutos <br>" + 
                segundos + " segundos";

            // 2. CÁLCULO PARA EL NUEVO CONTADOR (Años, meses y días)
            let anios = ahora.getFullYear() - inicio.getFullYear();
            let meses = ahora.getMonth() - inicio.getMonth();
            let dias = ahora.getDate() - inicio.getDate();

            if (dias < 0) {
                meses--;
                const ultimoDiaMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
                dias += ultimoDiaMesAnterior;
            }

            if (meses < 0) {
                anios--;
                meses += 12;
            }

            let textoAnios = "";
            if (anios > 0) textoAnios += anios + (anios === 1 ? " año <br>" : " años <br>");
            if (meses > 0) textoAnios += meses + (meses === 1 ? " mes <br>" : " meses <br>");
            textoAnios += dias + (dias === 1 ? " día" : " días");

            // Si lleváis menos de un mes, no mostramos el de arriba porque es igual al de abajo
            if (anios === 0 && meses === 0) {
                document.getElementById("contador-anios").style.display = "none";
                document.querySelector(".separador").style.display = "none";
            } else {
                document.getElementById("contador-anios").innerHTML = textoAnios;
            }
        }

        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>
</html>
