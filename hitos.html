<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nuestros Recuerdos</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #282c34;
            color: #abb2bf;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .contenedor {
            background: #21252b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 450px;
            margin: 0 auto;
        }
        h1 {
            color: #e06c75;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        .tarjeta-hito {
            background-color: #282c34;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #98c379;
        }
        .titulo-hito {
            color: #61afef;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .reloj-hito {
            color: #98c379;
            font-size: 1.1em;
            line-height: 1.5;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #e06c75;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            transition: 0.3s;
        }
        .btn-volver:hover {
            background-color: #be5058;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Tiempo desde... ⏳</h1>
        
        <div id="lista-hitos">
        </div>
        
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </div>

    <script>
        const eventos = [
            { id: "beso", nombre: "Nuestro primer beso 💋", fecha: new Date("2024-07-27T00:00:00") },
            { id: "tequiero", nombre: 'La primera vez que me dijiste "Te quiero"💙', fecha: new Date("2024-10-18T00:00:00") },
            { id: "viaje1", nombre: "Nuestro primer viaje juntos🛩️", fecha: new Date("2024-11-16T00:00:00") },
            { id: "concierto", nombre: "Nuestro primer concierto juntos🎤", fecha: new Date("2025-04-25T00:00:00") },
            { id: "belgica", nombre: "Nuestro viaje a Bélgica🍻", fecha: new Date("2026-09-01T00:00:00") }
        ];

        const contenedorHitos = document.getElementById("lista-hitos");


        eventos.forEach(evento => {
            contenedorHitos.innerHTML += `
                <div class="tarjeta-hito">
                    <div class="titulo-hito">${evento.nombre}</div>
                    <div class="reloj-hito" id="contador-${evento.id}">Calculando...</div>
                </div>
            `;
        });

        function actualizarTodosLosHitos() {
            const ahora = new Date();

            eventos.forEach(evento => {
                let anios = ahora.getFullYear() - evento.fecha.getFullYear();
                let meses = ahora.getMonth() - evento.fecha.getMonth();
                let dias = ahora.getDate() - evento.fecha.getDate();

                if (dias < 0) {
                    meses--;
                    const ultimoDiaMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
                    dias += ultimoDiaMesAnterior;
                }

                if (meses < 0) {
                    anios--;
                    meses += 12;
                }

                let textoReloj = "";
                if (anios > 0) textoReloj += anios + (anios === 1 ? " año, " : " años, ");
                if (meses > 0) textoReloj += meses + (meses === 1 ? " mes, " : " meses, ");
                textoReloj += dias + (dias === 1 ? " día" : " días");

                if (anios === 0 && meses === 0 && dias === 0) {
                    textoReloj = "¡Hoy!";
                }

                document.getElementById(`contador-${evento.id}`).innerHTML = textoReloj;
            });
        }

        setInterval(actualizarTodosLosHitos, 1000);
        actualizarTodosLosHitos();
    </script>
</body>
</html>
